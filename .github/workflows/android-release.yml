# ═══════════════════════════════════════════════════════════════════
# Android Release CI/CD — 极简心情记录 App
# ═══════════════════════════════════════════════════════════════════
#
# 使用方式:
#   1. 打 git 标签: git tag v0.1.0
#   2. 推送标签:   git push origin v0.1.0
#   3. 工作流自动触发: 编译 Release APK → 创建 GitHub Release → 上传 APK
#
# 签名说明:
#   默认使用 debug 签名，产出可安装的测试 APK，直接用于 Release 下载安装。
#   如需正式签名，在 GitHub 仓库 Settings → Secrets and variables → Actions 中配置:
#     SIGNING_KEYSTORE       — base64 编码的 .keystore/.jks 文件内容
#     SIGNING_KEY_ALIAS      — 密钥别名
#     SIGNING_KEY_PASSWORD   — 密钥密码
#     SIGNING_STORE_PASSWORD — keystore 密码
#   配置后取消下方 "正式签名配置" 部分的注释即可启用。
# ═══════════════════════════════════════════════════════════════════

name: Android Release

on:
  push:
    tags:
      # 匹配 v*.*.* 格式的标签，例如 v0.1.0、v1.2.3
      - 'v*.*.*'

# 同一时间同一标签只允许运行一个
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-release:
    name: Build APK & Create Release
    runs-on: ubuntu-latest

    permissions:
      contents: write  # 创建 Release 需要写权限

    steps:
      # ── 1. 检出代码（获取完整历史，用于生成变更日志） ──
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # 获取完整 git 历史

      # ── 2. 配置 JDK 17 (Android 编译要求) ──
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # ── 3. 配置 Gradle ──
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      # ── 4. (可选) 正式签名配置 ──
      # 取消注释并在 GitHub Secrets 中配置签名密钥后启用
      # - name: Decode signing keystore
      #   env:
      #     SIGNING_KEYSTORE: ${{ secrets.SIGNING_KEYSTORE }}
      #     SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
      #     SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
      #     SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
      #   run: |
      #     echo "$SIGNING_KEYSTORE" | base64 -d > app/release.keystore
      #     # 在 app/build.gradle.kts 中添加 signingConfigs.release 引用此文件

      # ── 5. 从 git tag 提取版本号 ──
      - name: Extract version from tag
        id: version
        run: |
          TAG=${GITHUB_REF#refs/tags/}     # v0.3.1
          VERSION=${TAG#v}                 # 0.3.1
          IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION"
          VERSION_CODE=$((MAJOR * 10000 + MINOR * 100 + PATCH))
          echo "version_name=$VERSION" >> $GITHUB_OUTPUT
          echo "version_code=$VERSION_CODE" >> $GITHUB_OUTPUT
          echo "Tag: $TAG → versionName=$VERSION, versionCode=$VERSION_CODE"

      # ── 6. 编译 Release APK (注入版本号) ──
      - name: Build Release APK
        run: |
          gradle assembleRelease --no-daemon --stacktrace \
            -PappVersionName=${{ steps.version.outputs.version_name }} \
            -PappVersionCode=${{ steps.version.outputs.version_code }}

      # ── 6. 重命名 APK (带版本号) ──
      - name: Rename APK
        id: apk
        run: |
          TAG=${GITHUB_REF#refs/tags/}
          APK_PATH=$(find app/build/outputs/apk/release -name "*.apk" | head -1)
          cp "$APK_PATH" "MoodTracker-${TAG}.apk"
          echo "apk_path=MoodTracker-${TAG}.apk" >> $GITHUB_OUTPUT
          echo "tag=$TAG" >> $GITHUB_OUTPUT

      # ── 7. 生成 Release 简介（功能介绍 + 本次更新内容） ──
      - name: Generate release notes
        id: notes
        run: |
          TAG=${GITHUB_REF#refs/tags/}

          # 找到上一个版本标签（按版本号排序）
          PREV_TAG=$(git tag --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | grep -A1 "^$TAG$" | tail -1)

          # 如果有上一个标签，生成两个版本之间的变更日志
          if [ -n "$PREV_TAG" ] && [ "$PREV_TAG" != "$TAG" ]; then
            echo "上一个版本: $PREV_TAG"
            # 提取 commit 信息，过滤掉 Merge commit，每行前加 📝
            CHANGES=$(git log --pretty=format:"- %s" ${PREV_TAG}..${TAG} --no-merges)
          else
            echo "首个版本，无前置标签"
            CHANGES=$(git log --pretty=format:"- %s" -10 --no-merges)
          fi

          # 写入 release body 文件
          cat > release_body.md << 'HEADER'
          极简心情&精神状态记录App
          一款本地优先的身心状态追踪工具，无需账号，所有记录保存在本机。

          ## 📱 核心功能
          - 5种情绪 + 5种精神状态，emoji 网格点击即记录，带弹跳动画反馈
          - 历史记录列表，支持全部/仅情绪/仅状态筛选，单条删除与清空
          - 统计仪表盘：高频项摘要卡 + 分布占比条形图 + 近7日记录走势柱状图
          - App 指纹/数字密码锁，保护隐私
          - 记录导出 CSV 备份
          - 自定义本地打卡提醒（支持开关与自定义时间）

          无广告、无网络上传、无 AI 心理分析，仅用于个人状态记录。
          适配 Android 10 及以上，Kotlin + Jetpack Compose 开发。

          ## 🔄 本次更新
          HEADER

          # 追加变更内容
          if [ -n "$CHANGES" ]; then
            echo "$CHANGES" >> release_body.md
          else
            echo "- 版本更新" >> release_body.md
          fi

          echo "" >> release_body.md
          echo "---" >> release_body.md
          echo "版本号: $TAG" >> release_body.md

          echo "release_body_file=release_body.md" >> $GITHUB_OUTPUT
          echo "tag=$TAG" >> $GITHUB_OUTPUT

      # ── 8. 创建 GitHub Release 并上传 APK ──
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.notes.outputs.tag }}
          name: ${{ steps.notes.outputs.tag }}
          files: ${{ steps.apk.outputs.apk_path }}
          body_path: ${{ steps.notes.outputs.release_body_file }}
          draft: false
          prerelease: false
